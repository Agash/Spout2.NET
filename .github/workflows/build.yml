name: build

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  release:
    types: [published]

env:
  NuGetDirectory: ${{ github.workspace }}/nuget

jobs:
  build_and_test:
    name: Build, Test, and Pack
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0        # MinVer needs full history
          submodules: recursive # Spout2 SDK for the native shim

      - uses: actions/setup-dotnet@v6
        with:
          # net11.0 needs the .NET 11 preview SDK alongside .NET 10; global.json selects it.
          dotnet-version: |
            10.0.x
            11.0.x

      - name: Build native shim (MSVC x64)
        shell: pwsh
        run: native/build-native.ps1

      - name: Restore
        run: dotnet restore Spout2.NET.slnx

      - name: Build
        run: dotnet build Spout2.NET.slnx --no-restore -c Release

      - name: Test (value-type, no GPU required)
        run: dotnet test Spout2.NET.slnx --no-build -c Release --filter "TestCategory!=RequiresGpu" -- --coverage --coverage-settings coverage.settings.xml --coverage-output-format cobertura --coverage-output coverage.cobertura.xml

      - name: Summarize coverage
        # Renders the cobertura totals into the run summary. Uploading the raw XML alone means nobody
        # ever looks at it; this puts the numbers on the run page itself.
        if: always()
        shell: bash
        run: |
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import glob, xml.etree.ElementTree as ET

          files = sorted(glob.glob('**/coverage.cobertura.xml', recursive=True))
          if not files:
              print('### Coverage\n\nNo coverage report was produced.')
              raise SystemExit(0)

          # Multi-targeted runs emit one report per TFM; they cover the same code, so report the first
          # and note how many were produced rather than double-counting.
          root = ET.parse(files[0]).getroot()

          def pct(attr):
              return float(root.get(attr) or 0) * 100

          print('### Coverage\n')
          print('| Metric | Covered | Total | Rate |')
          print('| --- | ---: | ---: | ---: |')
          print(f"| Lines | {root.get('lines-covered')} | {root.get('lines-valid')} | {pct('line-rate'):.1f}% |")
          print(f"| Branches | {root.get('branches-covered')} | {root.get('branches-valid')} | {pct('branch-rate'):.1f}% |")

          packages = root.findall('.//package')
          if packages:
              print('\n<details><summary>Per assembly</summary>\n')
              print('| Assembly | Lines | Branches |')
              print('| --- | ---: | ---: |')
              for p in sorted(packages, key=lambda p: p.get('name') or ''):
                  lr = float(p.get('line-rate') or 0) * 100
                  br = float(p.get('branch-rate') or 0) * 100
                  print(f"| {p.get('name')} | {lr:.1f}% | {br:.1f}% |")
              print('\n</details>')

          if len(files) > 1:
              print(f"\n_{len(files)} reports produced (one per target framework); totals shown for `{files[0]}`._")
          PY

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          if-no-files-found: warn
          path: '**/coverage.cobertura.xml'

      - name: Test (GPU round-trip)
        # Non-gating: GitHub Windows runners use WARP (software D3D11), where cross-device shared
        # texture sharing may not work. The local GPU run is the authoritative end-to-end check.
        continue-on-error: true
        run: dotnet test Spout2.NET.slnx --no-build -c Release --filter "TestCategory=RequiresGpu"

      - name: Pack
        if: github.event_name == 'release' || github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
        run: dotnet pack src/Spout2.NET/Spout2.NET.csproj --no-build -c Release -o ${{ env.NuGetDirectory }}

      - name: Upload package artifact
        if: github.event_name == 'release' || github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v7
        with:
          name: nuget-package
          if-no-files-found: error
          retention-days: 1
          path: ${{ env.NuGetDirectory }}/*.nupkg

  publish_nuget:
    name: Publish NuGet Packages
    needs: [build_and_test]
    # Publishing runs only when a GitHub release is published (or manually dispatched), matching the
    # other Agash packages. Requires a NuGet.org trusted-publishing policy for this package.
    if: (github.event_name == 'release' && github.event.action == 'published') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    # Declaring an environment is what makes GitHub record a deployment, which is what
    # surfaces the Deployments tab and the package link on the repo home page.
    environment:
      name: nuget.org
      url: https://www.nuget.org/packages/Spout2.NET
    permissions:
      contents: read
      id-token: write   # OIDC for NuGet.org trusted publishing

    steps:
      - name: Download package artifact
        uses: actions/download-artifact@v8
        with:
          name: nuget-package
          path: ${{ env.NuGetDirectory }}

      - uses: actions/setup-dotnet@v6

      - name: NuGet login (OIDC)
        id: login
        uses: NuGet/login@v1
        with:
          user: Agash

      - name: Publish packages
        shell: bash
        run: |
          for f in "${{ env.NuGetDirectory }}"/*.nupkg; do
            echo "Pushing $f"
            dotnet nuget push "$f" \
              --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" \
              --source https://api.nuget.org/v3/index.json \
              --skip-duplicate
          done
