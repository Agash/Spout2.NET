name: build

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  release:
    types: [published]

env:
  NuGetDirectory: ${{ github.workspace }}/nuget

jobs:
  build_and_test:
    name: Build, Test, and Pack
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0        # MinVer needs full history
          submodules: recursive # Spout2 SDK for the native shim

      - uses: actions/setup-dotnet@v5
        with:
          # net11.0 needs the .NET 11 preview SDK alongside .NET 10; global.json selects it.
          dotnet-version: |
            10.0.x
            11.0.x

      - name: Build native shim (MSVC x64)
        shell: pwsh
        run: native/build-native.ps1

      - name: Restore
        run: dotnet restore Spout2.NET.slnx

      - name: Build
        run: dotnet build Spout2.NET.slnx --no-restore -c Release

      - name: Test (value-type, no GPU required)
        run: dotnet test Spout2.NET.slnx --no-build -c Release --filter "TestCategory!=RequiresGpu"

      - name: Test (GPU round-trip)
        # Non-gating: GitHub Windows runners use WARP (software D3D11), where cross-device shared
        # texture sharing may not work. The local GPU run is the authoritative end-to-end check.
        continue-on-error: true
        run: dotnet test Spout2.NET.slnx --no-build -c Release --filter "TestCategory=RequiresGpu"

      - name: Pack
        if: github.event_name == 'release' || github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
        run: dotnet pack src/Spout2.NET/Spout2.NET.csproj --no-build -c Release -o ${{ env.NuGetDirectory }}

      - name: Upload package artifact
        if: github.event_name == 'release' || github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v7
        with:
          name: nuget-package
          if-no-files-found: error
          retention-days: 1
          path: ${{ env.NuGetDirectory }}/*.nupkg

  publish_nuget:
    name: Publish NuGet Packages
    needs: [build_and_test]
    # Publishing runs only when a GitHub release is published (or manually dispatched), matching the
    # other Agash packages. Requires a NuGet.org trusted-publishing policy for this package.
    if: (github.event_name == 'release' && github.event.action == 'published') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write   # OIDC for NuGet.org trusted publishing

    steps:
      - name: Download package artifact
        uses: actions/download-artifact@v8
        with:
          name: nuget-package
          path: ${{ env.NuGetDirectory }}

      - uses: actions/setup-dotnet@v5

      - name: NuGet login (OIDC)
        id: login
        uses: NuGet/login@v1
        with:
          user: Agash

      - name: Publish packages
        shell: bash
        run: |
          for f in "${{ env.NuGetDirectory }}"/*.nupkg; do
            echo "Pushing $f"
            dotnet nuget push "$f" \
              --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" \
              --source https://api.nuget.org/v3/index.json \
              --skip-duplicate
          done
