name: Bug report
description: Report a problem with Spout2.NET
labels: [bug]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: A clear description of the bug and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Minimal code or steps that trigger the problem. Note whether you were publishing or receiving, and which other app was involved (for example OBS).
    validations:
      required: true
  - type: input
    id: package-version
    attributes:
      label: Spout2.NET version
      placeholder: e.g. 0.1.0
    validations:
      required: true
  - type: input
    id: windows-version
    attributes:
      label: Windows version and GPU
      placeholder: e.g. Windows 11 23H2, NVIDIA RTX 4070
    validations:
      required: true
  - type: input
    id: dotnet-version
    attributes:
      label: .NET version
      placeholder: e.g. 10.0.100
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Relevant exception or console output, if any.
      render: shell
    validations:
      required: false
